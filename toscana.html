<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reindirizzamento Agenda Faitango</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Generazione filtro eventi in corso...</h2>
    <p>Verrai reindirizzato all'agenda Faitango con le date aggiornate a partire da oggi per un mese.</p>
    <div class="loader"></div>
    <p>Se non vieni reindirizzato, <a id="fallback-link" href="#">clicca qui</a>.</p>
</div>

<script>
    function formatDate(date) {
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        return `${day}%2F${month}%2F${year}`;
    }

    // 1. Calcola la data corrente (oggi)
    const oggi = new Date();

    // 2. Calcola la data tra un mese esatto
    const traUnMese = new Date();
    traUnMese.setMonth(oggi.getMonth() + 1);

    // Formatta le date per l'URL (DD%2FMM%2FYYYY)
    const dataInizio = formatDate(oggi);
    const dataFine = formatDate(traUnMese);

    // 3. Costruisci l'URL dinamico mantenendo i tuoi filtri intatti
    const baseUrl = "https://www.faitango.it/agenda-eventi";
    const queryParams = `?f%5BtE%5D%5B1%5D=1&f%5BtE%5D%5B3%5D=3&f%5BtE%5D%5B4%5D=4&f%5BtE%5D%5B5%5D=5&f%5BtE%5D%5B6%5D=6&f%5BtE%5D%5B7%5D=7&f%5BtE%5D%5B8%5D=8&f%5BtE%5D%5B9%5D=9&f%5BtE%5D%5B10%5D=10&f%5BgS%5D=1&f%5BgP%5D%5B%5D=89&f%5BgP%5D%5B%5D=90&f%5BgP%5D%5B%5D=97&f%5BgP%5D%5B%5D=96&f%5BgP%5D%5B%5D=98&f%5BdT%5D%5B0%5D=${dataInizio}&f%5BdT%5D%5B1%5D=${dataFine}&f%5Bo%5D%5Bd%5D=0&f%5Bo%5D%5Bc%5D=1642&f%5BtT%5D=&sa=1`;
    
    const finalUrl = baseUrl + queryParams;

    // Configura il link di emergenza
    document.getElementById('fallback-link').href = finalUrl;

    // 4. Esegui il reindirizzamento automatico
    window.location.href = finalUrl;
</script>

</body>
</html>
